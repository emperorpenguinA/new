<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍜 ラーメンマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍜 ラーメンマップ</h1>
<p>
	Google TakeoutでエクスポートしたGoogleフォトのフォルダを指定すると、
	写真の位置情報(EXIFまたはTakeoutの付属JSON)から地図上にプロットします。
</p>

<section id="step-scan">
	<label for="folderPathInput">エクスポートしたフォルダのパス</label><br>
	<input type="text" id="folderPathInput" size="60" placeholder="例: /home/you/Downloads/Takeout/Google フォト">
	<button id="scanButton">スキャンする</button>
	<p id="scanMessage" class="notice" hidden></p>
</section>

<section id="step-map" hidden>
	<p id="mapSummary"></p>
	<button id="rescanButton">別のフォルダをスキャンする</button>
	<div id="map"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
