<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍜 ラーメンマップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍜 ラーメンマップ</h1>
<p>Googleフォトにあるラーメンの写真を選ぶと、位置情報(EXIF)から地図上にプロットします。</p>

<section id="step-login">
	<button id="loginButton">Googleフォトと連携する</button>
</section>

<section id="step-pick" hidden>
	<button id="startPickButton">Googleフォトで写真を選ぶ</button>
</section>

<section id="step-waiting" hidden>
	<ol>
		<li>開いたタブでラーメンの写真を選択してください(複数選択可)。</li>
		<li>選択が終わったら、Googleフォト側の画面で完了し、このタブに戻って下のボタンを押してください。</li>
	</ol>
	<button id="openPickerButton">Googleフォトを開く</button>
	<button id="checkDoneButton">選択を確認する</button>
	<p id="waitingMessage" class="notice" hidden>まだ選択が完了していないようです。もう一度お試しください。</p>
</section>

<section id="step-map" hidden>
	<p id="mapSummary"></p>
	<button id="restartButton">別の写真でつくり直す</button>
	<div id="map"></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
